# Flux Kustomizations for infrastructure/experiments/ -- time-boxed spikes that
# are expected to be deleted. See infrastructure/experiments/README.md.
#
# WHY THESE ARE SEPARATE KUSTOMIZATIONS, AND NOT PART OF infra-controllers:
#
# infra-controllers -> infra-configs -> apps is a chain, and every link has
# `wait: true`. A workload that never becomes Ready inside infra-controllers
# holds that Kustomization, which holds infra-configs, which holds apps -- and
# then nothing under apps/ receives updates until it is fixed. An experiment is
# by definition a thing that might not come up, so it gets its own Kustomizations
# with nothing depending on them. A failure here is loud, contained, and costs
# nothing else.
#
# They depend on cluster-config only, the same as infra-controllers, so they are
# not gated behind the controllers they do not need.
---
# 1. Ask the cheap question first.
#
# Can a pod reach the .app zone's LoadBalancer address, which is served by pods
# in this same cluster? Everything else here depends on yes. `wait: true` on a
# Job means this Kustomization is Ready only when the Job has actually completed,
# so it is a real gate rather than a note in a README.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: experiment-hairpin-probe
  namespace: flux-system
spec:
  dependsOn:
    - name: cluster-config
  interval: 1h
  retryInterval: 5m
  # Generous: three pods have to schedule on three distinct nodes and each makes
  # four HTTP requests with a 10s timeout.
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/experiments/tailscale-app-zone/probe
  postBuild:
    substitute: {}
    substituteFrom:
      - kind: ConfigMap
        name: global-config
      - kind: Secret
        name: global-secrets
      - kind: ConfigMap
        name: cluster-config
      - kind: Secret
        name: cluster-secrets
  prune: true
  wait: true
---
# 2. Only then install the operator.
#
# dependsOn the probe, so a failed hairpin means the operator is never installed:
# no device registered on the tailnet, no auth key minted, nothing to unpick
# afterwards. That ordering is the point -- it is cheaper to not deploy than to
# deploy and roll back.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: experiment-tailscale-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: experiment-hairpin-probe
  interval: 1h
  retryInterval: 5m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/experiments/tailscale-app-zone/operator
  postBuild:
    substitute: {}
    substituteFrom:
      - kind: ConfigMap
        name: global-config
      - kind: Secret
        name: global-secrets
      - kind: ConfigMap
        name: cluster-config
      - kind: Secret
        name: cluster-secrets
  prune: true
  wait: true
---
# 3. The route, last.
#
# Separate from the operator only because the Connector is a CRD the operator's
# chart installs. Applied in the same Kustomization it would fail on an unknown
# kind on the first pass, recover on a later retry, and leave a failed
# Kustomization in between that looks like the experiment failing. dependsOn
# removes that ambiguity.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: experiment-tailscale-connector
  namespace: flux-system
spec:
  dependsOn:
    - name: experiment-tailscale-operator
  interval: 1h
  retryInterval: 5m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/experiments/tailscale-app-zone/connector
  postBuild:
    substitute: {}
    substituteFrom:
      - kind: ConfigMap
        name: global-config
      - kind: Secret
        name: global-secrets
      - kind: ConfigMap
        name: cluster-config
      - kind: Secret
        name: cluster-secrets
  prune: true
  # wait: false, and the reason is specific rather than general.
  #
  # The Connector DOES report readiness -- but the condition is typed
  # `ConnectorReady` (k8s-operator/apis/v1alpha1/types_connector.go), and
  # kstatus only recognises `Ready`, `Reconciling` and `Stalled` on a custom
  # resource. Finding none of those, it falls through to the observedGeneration
  # check and returns Current. So `wait: true` here would not block on a router
  # that failed to come up; it would pass immediately and mean nothing, which is
  # worse than not asking.
  #
  # Whether the route works is answered by `kubectl get connector` -- whose
  # STATUS column reads that same ConnectorReady condition -- and by the device.
  wait: false
