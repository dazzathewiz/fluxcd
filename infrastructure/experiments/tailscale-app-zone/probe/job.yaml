---
# The probe's targets, in a Secret rather than a ConfigMap.
#
# PERSONAL_DOMAIN comes from global-secrets, and AGENTS.md is explicit: a
# substituted secret var goes in a Secret, never a ConfigMap, because the
# read-only view identities can read ConfigMaps. The Job reads these by envFrom,
# so no resolved value appears in a pod spec either -- only in the Job's own log
# output, which is the point of running it.
#
# The two addresses are not secret (10.10.x is knowingly public here) but they
# are taken from the vars rather than typed, so a re-addressing does not leave a
# stale literal behind. cluster-config holds them.
apiVersion: v1
kind: Secret
metadata:
  name: hairpin-probe-targets
  namespace: tailscale
type: Opaque
stringData:
  APP_HOST: "inventory.app.${PERSONAL_DOMAIN}"
  APP_PATH: "/api/"
  APP_ADDR: "${LB_TRAEFIK_APP}"
  # A hostname on the OTHER zone, used only to confirm it is refused on this
  # zone's address. Any .inf host would do; this one is always present.
  INF_HOST: "longhorn.inf.${PERSONAL_DOMAIN}"
  INF_ADDR: "${LB_TRAEFIK}"
---
# Does the pod network reach the .app zone address?
#
# Everything else in this experiment depends on the answer, so it is asked first
# and cheaply. See ../README.md for what each assertion means and why C is the
# one worth keeping.
apiVersion: batch/v1
kind: Job
metadata:
  name: hairpin-probe
  namespace: tailscale
  labels:
    app.kubernetes.io/part-of: experiment-tailscale-app-zone
  annotations:
    # LOAD-BEARING. Flux's postBuild substitution rewrites every ${...} in a
    # manifest, and an unknown name resolves to the empty string rather than
    # erroring. The shell script below is full of ${...} -- NODE_NAME,
    # JOB_COMPLETION_INDEX, CODE -- none of which are Flux vars, so without this
    # annotation the script is silently emptied out and the probe reports
    # nonsense rather than failing.
    #
    # The Secret above still gets substitution; this annotation is per-resource.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  # Three pods on three different nodes. One node answering is not the claim
  # being made -- the router pod is not pinned and could land anywhere, and the
  # redirect this tests is done per-node by kube-proxy.
  completions: 3
  parallelism: 3
  completionMode: Indexed
  # No retries. A retry would overwrite the log of the run that failed, which is
  # the only thing this Job produces.
  backoffLimit: 0
  # ttlSecondsAfterFinished is deliberately unset: with a TTL the Job deletes
  # itself, Flux recreates it from Git on the next reconcile, and the probe runs
  # forever on a slow loop. Re-running it is a deliberate manual delete.
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: experiment-tailscale-app-zone
    spec:
      restartPolicy: Never
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                job-name: hairpin-probe
      containers:
      - name: probe
        image: curlimages/curl:8.22.0
        envFrom:
        - secretRef:
            name: hairpin-probe-targets
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        command:
        - /bin/sh
        - -c
        - |
          set -u
          CODE=000
          fail=0

          # probe <host> <addr> <path> [extra curl args...]
          probe() {
            h=$1; a=$2; p=$3; shift 3
            # curl's own stderr is left alone deliberately, so it lands in the
            # pod log next to the result. On a failure the status alone is 000
            # and says nothing; curl's message says whether it was a timeout, a
            # refused connection or a certificate it would not accept.
            CODE=$(curl -sS -m 10 -o /dev/null -w '%{http_code}' "$@" \
                     --resolve "$h:443:$a" "https://$h$p") || CODE=""
            # A connection that never completes prints nothing, or prints 000.
            # Normalise both, so a transport failure is never mistaken for an
            # HTTP status.
            case "$CODE" in ''|*[!0-9]*) CODE=000 ;; esac
          }

          # check <label> <expected> <actual>
          check() {
            if [ "$2" = "$3" ]; then
              printf 'PASS  %-56s got %s\n' "$1" "$3"
            else
              printf 'FAIL  %-56s got %s, want %s\n' "$1" "$3" "$2"
              fail=1
            fi
          }

          echo "node: ${NODE_NAME}   index: ${JOB_COMPLETION_INDEX:-?}"
          echo

          # A. Very likely to PASS -- kube-proxy short-circuits a pod's traffic
          #    to a LoadBalancer address inside the node, and traefik-app is
          #    externalTrafficPolicy: Cluster. Kept because it is nearly free
          #    and the design collapses outright without it, NOT because it is
          #    the risk; a pass here is not evidence the design works. See
          #    ../README.md. TLS verification is off on purpose, so that a
          #    certificate problem cannot be misread as a routing problem --
          #    B tests the certificate separately.
          probe "$APP_HOST" "$APP_ADDR" "$APP_PATH" -k
          check "A  app reachable via the .app zone address" 200 "$CODE"

          # B. Same request, verifying the chain against the image's CA bundle.
          #    If A passes and B fails, the route is fine and the wildcard
          #    certificate is not being served on this entrypoint.
          probe "$APP_HOST" "$APP_ADDR" "$APP_PATH"
          check "B  certificate on that path validates" 200 "$CODE"

          # C. Containment. A hostname from the .inf zone, sent to the .app
          #    address, must not be served. 404 means Traefik has no route for
          #    it on this entrypoint, which is the whole basis for pointing a
          #    restricted device at this address.
          probe "$INF_HOST" "$APP_ADDR" "/" -k
          check "C  .inf host refused on the .app address" 404 "$CODE"

          # Not an assertion. Expected to succeed, and recorded so the limit of
          # this design is written down where it is measured: any pod can reach
          # the other zone directly. A personal device cannot, because it is
          # given one /32 route and an access rule -- not because the cluster
          # stops it.
          probe "$INF_HOST" "$INF_ADDR" "/" -k
          printf 'INFO  %-56s got %s  (expected; see README)\n' \
            "pod reaches the .inf zone directly" "$CODE"

          echo
          if [ "$fail" -eq 0 ]; then
            echo "RESULT pass -- a router pod on this node can serve the .app zone"
          else
            echo "RESULT fail -- do not install the operator; read the lines above"
          fi
          exit "$fail"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
