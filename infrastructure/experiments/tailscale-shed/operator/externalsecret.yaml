---
# The chart will use a pre-existing Secret named `<release fullname>-oauth` if
# one is there, and only templates its own when a client id is passed as a Helm
# value. The value is NOT passed: a HelmRelease is not a Secret, and the
# resolved credential would end up in the release object and in this repo's
# rendered output.
#
# The name and the two key names are fixed by the chart, not chosen here:
#   Secret  operator-oauth        (fullname defaults to "operator")
#   keys    client_id, client_secret
# Renaming either breaks the operator with "no credentials" rather than an
# obvious error, so leave them.
#
# Credential store item `tailscale-operator` must exist first, with properties
# `client-id` and `client-secret`, from a client that owns the operator's tag and
# has write scope on services, devices and auth keys. Until it does, this
# ExternalSecret does not sync and the operator Kustomization holds -- which is
# the intended failure: contained, and nothing downstream depends on it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-k3s
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
  - secretKey: client_id
    remoteRef:
      key: tailscale-operator
      property: client-id
  - secretKey: client_secret
    remoteRef:
      key: tailscale-operator
      property: client-secret
