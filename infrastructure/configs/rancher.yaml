---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rancher
  namespace: flux-system
spec:
  interval: 5m
  releaseName: rancher-stable
  targetNamespace: cattle-system
  install:
    createNamespace: true
  chart:
    spec:
      chart: rancher
      version: 2.15.3
      sourceRef:
        kind: HelmRepository
        name: rancher-stable
        namespace: flux-system
      interval: 1m
  # The 2.15.3 upgrade hit a 5m timeout with the 3-replica Deployment still
  # InProgress. That left the release Stalled (RetriesExceeded) after the
  # rollout finished, until a forced reconcile.
  timeout: 15m
  values:
    hostname: rancher.inf.${PERSONAL_DOMAIN}
    ingress:
      # Pin to websecure. In Traefik v2 an Ingress naming no entrypoint attaches
      # to every entrypoint, including appsecure -- which would put Rancher on
      # the .app address (see docs/app-zone.md).
      extraAnnotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      tls:
        source: secret
        secretName: inf-personal-domain-tls
