---
# Secret name and keys are fixed by the chart (`<fullname>-oauth`); don't rename.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-k3s
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
  - secretKey: client_id
    remoteRef:
      key: tailscale-operator
      property: client-id
  - secretKey: client_secret
    remoteRef:
      key: tailscale-operator
      property: client-secret
