---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: tailscale
  namespace: flux-system
spec:
  interval: 1h
  url: https://pkgs.tailscale.com/helmcharts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: flux-system
spec:
  interval: 30m
  releaseName: tailscale-operator
  targetNamespace: tailscale
  # Namespace is declared in namespace.yaml.
  chart:
    spec:
      chart: tailscale-operator
      # Pinned exactly: the chart version is the client version on the tailnet.
      version: 1.102.4
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
      interval: 1h
  timeout: 5m
  values:
    # Provides the Connector CRD.
    installCRDs: true

    operatorConfig:
      logging: info
      # Must match the OAuth client's tag and the tailnet policy exactly.
      defaultTags: ["tag:k3s-operator"]
      hostname: k3s-tailscale-operator
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi

    # Off: would serve workloads on ts.net names and claim an IngressClass.
    ingressClass:
      enabled: false

    # Off: would expose the cluster API server on the tailnet.
    apiServerProxyConfig:
      mode: "false"
      allowImpersonation: "false"

    proxyConfig:
      # Fallback tag for proxies that don't set spec.tags.
      defaultTags: "tag:k3s"
