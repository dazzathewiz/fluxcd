---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 30m
  url: https://helm.traefik.io/traefik
---
apiVersion: v1
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: traefik-helm-chart-value-overrides
  namespace: flux-system
data:
  values.yaml: |-
    globalArguments:
    - "--global.sendanonymoususage=false"
    - "--global.checknewversion=false"

    additionalArguments:
      - "--serversTransport.insecureSkipVerify=true"
      - "--log.level=INFO"
    
    deployment:
      enabled: true
      replicas: 3
      annotations: {}
      podAnnotations: {}
      additionalContainers: []
      initContainers: []

    ports:
      web:
        redirectTo: websecure
      websecure:
        tls:
          enabled: true
      # Second HTTPS entrypoint, for the *.app zone only.
      #
      # `expose: false` keeps it OFF Traefik's own LoadBalancer Service. It is
      # published instead by the standalone `traefik-app` Service
      # (traefik-app-service.yaml), which holds its own MetalLB address.
      #
      # Why: every .inf route answers on Traefik's single address, so any client
      # permitted to reach that address can reach every app behind it just by
      # sending a different Host header -- app-level auth is the only thing in
      # the way. Routes bound to `appsecure` answer on a different address that
      # has no .inf route attached, so a client restricted to it cannot reach
      # .inf at all, forged Host header or not.
      #
      # NOTE on chart upgrades: `expose` is a boolean in chart 2x (pinned below).
      # Traefik chart 26+ changes it to a map (`expose: {default: false}`). This
      # block must be revisited as part of any chart major bump, not after.
      #
      # Port 8444, not 8443: 8443 is already websecure's container port, and two
      # entrypoints on one address means only one of them binds.
      appsecure:
        port: 8444
        expose: false
        exposedPort: 8444
        protocol: TCP
        tls:
          enabled: true
          
    ingressRoute:
      dashboard:
        enabled: false

    providers:
      kubernetesCRD:
        enabled: true
        ingressClass: traefik-external
        allowExternalNameServices: true
      kubernetesIngress:
        enabled: true
        allowExternalNameServices: true
        publishedService:
          enabled: false

    rbac:
      enabled: true

    service:
      enabled: true
      type: LoadBalancer
      annotations: {}
      labels: {}
      spec:
        loadBalancerIP: ${LB_TRAEFIK} # this should be an IP in the MetalLB range
      loadBalancerSourceRanges: []
      externalIPs: []
    
    topologySpreadConstraints:
    # # This example topologySpreadConstraints forces the scheduler to put traefik pods
    # # on nodes where no other traefik pods are scheduled.
      - labelSelector:
          matchLabels:
            app: '{{ template "traefik.name" . }}'
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 5m
  releaseName: traefik
  targetNamespace: traefik
  install:
    createNamespace: true
  chart:
    spec:
      chart: traefik
      version: '>=22.1.0 <24.0.0'
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 1m
  timeout: 5m
  valuesFrom:
  - kind: ConfigMap
    name: traefik-helm-chart-value-overrides
    valuesKey: values.yaml # This is the default, but best to be explicit for clarity
