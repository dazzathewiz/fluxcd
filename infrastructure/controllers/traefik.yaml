---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 30m
  url: https://helm.traefik.io/traefik
---
apiVersion: v1
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: traefik-helm-chart-value-overrides
  namespace: flux-system
data:
  values.yaml: |-
    globalArguments:
    - "--global.sendanonymoususage=false"
    - "--global.checknewversion=false"

    additionalArguments:
      - "--serversTransport.insecureSkipVerify=true"
      - "--log.level=INFO"
    
    deployment:
      enabled: true
      replicas: 3
      annotations: {}
      podAnnotations: {}
      additionalContainers: []
      initContainers: []

    ports:
      web:
        redirectTo: websecure
      websecure:
        tls:
          enabled: true
      # Second HTTPS entrypoint, for the *.app zone only.
      #
      # `expose: false` keeps it OFF Traefik's own LoadBalancer Service. It is
      # published instead by the standalone `traefik-app` Service
      # (traefik-app-service.yaml), which holds its own MetalLB address.
      #
      # Why: every .inf route answers on Traefik's single address, so any client
      # permitted to reach that address can reach every app behind it just by
      # sending a different Host header -- app-level auth is the only thing in
      # the way. Routes bound to `appsecure` answer on a different address that
      # has no .inf route attached, so a client restricted to it cannot reach
      # .inf at all, forged Host header or not.
      #
      # NOTE on chart upgrades: `expose` is a boolean in chart 2x (pinned below).
      # Traefik chart 26+ changes it to a map (`expose: {default: false}`). This
      # block must be revisited as part of any chart major bump, not after.
      #
      # Port 8444, not 8443: 8443 is already websecure's container port, and two
      # entrypoints on one address means only one of them binds.
      #
      # exposedPort is 443 even though the chart doesn't publish this port: it's
      # what the traefik-app Service publishes, and it's the port appweb's
      # redirectTo sends clients to (the chart builds the redirect from the
      # target entrypoint's exposedPort).
      appsecure:
        port: 8444
        expose: false
        exposedPort: 443
        protocol: TCP
        tls:
          enabled: true
      # Plain-HTTP companion to appsecure: redirects http://*.app to https on the
      # same address. Its own entrypoint rather than `web` so the .app address
      # still shares no entrypoint with .inf -- anything later bound to `web`
      # stays off it. Published by traefik-app on port 80.
      appweb:
        port: 8001
        expose: false
        exposedPort: 80
        protocol: TCP
        redirectTo: appsecure
          
    ingressRoute:
      dashboard:
        enabled: false

    providers:
      kubernetesCRD:
        enabled: true
        ingressClass: traefik-external
        allowExternalNameServices: true
      kubernetesIngress:
        enabled: true
        allowExternalNameServices: true
        publishedService:
          enabled: false

    rbac:
      enabled: true

    service:
      enabled: true
      type: LoadBalancer
      annotations: {}
      labels: {}
      spec:
        loadBalancerIP: ${LB_TRAEFIK} # this should be an IP in the MetalLB range
      loadBalancerSourceRanges: []
      externalIPs: []
    
    # Spread the replicas across nodes, so losing one node does not take every
    # ingress route in the cluster with it.
    #
    # THE SELECTOR MUST MATCH THE PODS' REAL LABELS. It previously read
    # `app: {{ template "traefik.name" . }}`, which renders to `app: traefik` --
    # a label these pods do not carry. A spread constraint whose selector matches
    # nothing is vacuous: every domain counts zero matching pods, the skew is
    # always zero, and the scheduler is free to pile every replica onto one node.
    # It did exactly that. Nothing errors and nothing warns; the only symptom is
    # `kubectl -n traefik get pods -o wide` showing one NODE value.
    #
    # The two labels below are the same pair the Traefik Services select on.
    # Check them, don't assume them:
    #   kubectl -n traefik get svc traefik -o jsonpath='{.spec.selector}'
    #
    # whenUnsatisfiable is ScheduleAnyway rather than DoNotSchedule, for two
    # reasons.
    #
    # It has to be, because of the masters. Skew is measured as (pods on the
    # target node + 1) minus the pod count on the emptiest eligible node. The
    # default nodeTaintsPolicy is Ignore, so the three tainted k3smaster nodes
    # count as eligible domains -- and Traefik does not tolerate their taint,
    # so they hold 0 pods forever. The global minimum is therefore always 0,
    # and under DoNotSchedule no worker may ever hold more than one pod. With
    # three replicas on three workers, any pod beyond 1/1/1 -- including a
    # rolling-update surge pod -- has nowhere to go and sits Pending. The
    # HelmRelease upgrade then times out, which stalls infra-configs and the
    # whole apps tree behind it. This holds from a balanced state too, so
    # "balance first, then switch to DoNotSchedule" does NOT make it safe. A
    # hard constraint would additionally need `nodeTaintsPolicy: Honor`.
    #
    # And it should be: for the cluster's only ingress, an unbalanced Traefik
    # is better than a Pending one -- a hard constraint converts "cannot
    # spread" into "no pod".
    topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-traefik
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway

    # Take a pod down before bringing its replacement up, instead of the
    # chart's default surge-first (maxSurge: 1, maxUnavailable: 0).
    #
    # ScheduleAnyway is only a scoring preference, and with surge-first and
    # exactly as many replicas as workers, the last surge pod of every rollout
    # is created while each worker already holds one pod. All three score
    # equally, it lands anywhere, and when the last old pod goes the result is
    # often 2/1/0 rather than 1/1/1. Removing a pod first always leaves one
    # worker empty, so the replacement's preference has a clear winner and the
    # rollout ends 1/1/1. The cost is running two of three replicas while a
    # rollout is in progress.
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 5m
  releaseName: traefik
  targetNamespace: traefik
  install:
    createNamespace: true
  chart:
    spec:
      chart: traefik
      version: '>=22.1.0 <24.0.0'
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 1m
  timeout: 5m
  valuesFrom:
  - kind: ConfigMap
    name: traefik-helm-chart-value-overrides
    valuesKey: values.yaml # This is the default, but best to be explicit for clarity
