---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: 1password
  namespace: flux-system
spec:
  interval: 30m
  url: https://1password.github.io/connect-helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: 1password
  namespace: flux-system
spec:
  interval: 5m
  releaseName: 1password-connect
  targetNamespace: 1password
  install:
    createNamespace: true
  chart:
    spec:
      chart: connect
      version: 2.4.3
      sourceRef:
        kind: HelmRepository
        name: 1password
        namespace: flux-system
      interval: 1m
  timeout: 5m
  # The op-credentials and onepassword-connect-token Secrets are not in this
  # repo: the k3s-ansible provisioning repo creates them. Since chart 2.3.0
  # op-credentials must hold the raw JSON, not base64. See
  # infrastructure/doc-1password/README.md.
  #values:
    # See: https://github.com/1Password/connect-helm-charts/blob/main/charts/connect/values.yaml
