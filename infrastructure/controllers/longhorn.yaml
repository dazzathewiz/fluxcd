---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 30m
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 5m
  releaseName: longhorn
  targetNamespace: longhorn-system
  install:
    createNamespace: true
  upgrade:
    # Retry a failed upgrade forward instead of rolling back: Longhorn doesn't
    # support downgrades, so a Helm rollback mid-upgrade can leave it worse off.
    strategy:
      name: RetryOnFailure
      retryInterval: 10m
  chart:
    spec:
      chart: longhorn
      version: '>=1.4.2 <1.13.0' # 1.13 needs k8s >=1.34
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 1m
  timeout: 15m
  values:
    defaultSettings:
      backupTarget: s3://${LONGHORN_S3_BUCKET_NAME}@${LONGHORN_S3_BUCKET_REGION}/
      backupTargetCredentialSecret: longhorn-s3bucket-secret
      createDefaultDiskLabeledNodes: true
      defaultDataPath: /mnt/longhorn/
      storageReservedPercentageForDefaultDisk: "0"
