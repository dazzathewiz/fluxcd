---
# Second LoadBalancer address for Traefik, serving the `appsecure` entrypoint
# and nothing else.
#
# This is a standalone Service rather than a second entry in the Traefik chart's
# own `service:` block, because the pinned chart (>=22.1.0 <24.0.0) supports only
# one Service per release. It selects the same Traefik pods; only the target port
# differs, so nothing about the existing address changes.
#
# The address is a literal rather than a ${LB_*} SOPS var on purpose: internal
# 10.10.x addressing is knowingly public in this repo (see AGENTS.md), and a SOPS
# edit carries cluster-wide blast radius for every Kustomization that reads those
# var files.
#
# BEFORE MERGE, verify both of these against the live cluster:
#   1. 10.10.1.103 is inside the MetalLB pool and unclaimed:
#        kubectl get svc -A -o wide | grep LoadBalancer
#   2. the selector below matches Traefik's own Service exactly:
#        kubectl -n traefik get svc traefik -o jsonpath='{.spec.selector}'
#      If it differs, copy what that prints. A selector that matches nothing
#      produces a Service with no endpoints and an address that silently
#      blackholes -- it does not error.
apiVersion: v1
kind: Service
metadata:
  name: traefik-app
  namespace: traefik
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: app-zone-entrypoint
spec:
  type: LoadBalancer
  loadBalancerIP: 10.10.1.103
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-traefik
  ports:
    - name: appsecure
      protocol: TCP
      port: 443
      targetPort: 8443
