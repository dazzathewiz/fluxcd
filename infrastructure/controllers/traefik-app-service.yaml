---
# Second LoadBalancer address for Traefik, serving the `appsecure` entrypoint
# (443) and its HTTP-to-HTTPS redirect `appweb` (80), and nothing else.
#
# This is a standalone Service rather than a second entry in the Traefik chart's
# own `service:` block, because the pinned chart (>=22.1.0 <24.0.0) supports only
# one Service per release. It selects the same Traefik pods; only the target port
# differs, so nothing about the existing address changes.
#
# The address is LB_TRAEFIK_APP from cluster-config (a plain ConfigMap, like the
# other LB_* addresses). It must not be shared with any other Service: a client
# confined to this address should reach the appsecure entrypoint and nothing else.
#
# The selector must match Traefik's own Service exactly:
#   kubectl -n traefik get svc traefik -o jsonpath='{.spec.selector}'
# A selector that matches nothing produces a Service with no endpoints and an
# address that silently blackholes -- it does not error.
apiVersion: v1
kind: Service
metadata:
  name: traefik-app
  namespace: traefik
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: app-zone-entrypoint
spec:
  type: LoadBalancer
  loadBalancerIP: "${LB_TRAEFIK_APP}"
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-traefik
  ports:
    - name: appweb
      protocol: TCP
      port: 80
      targetPort: appweb
    - name: appsecure
      protocol: TCP
      port: 443
      targetPort: appsecure
