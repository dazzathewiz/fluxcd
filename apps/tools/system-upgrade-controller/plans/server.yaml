---
# yaml-language-server: $schema=https://kochhaus-schemas.pages.dev/upgrade.cattle.io/plan_v1.json
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server
spec:
  # renovate: datasource=github-releases depName=k3s-io/k3s
  version: v1.33.13+k3s2
  serviceAccountName: system-upgrade
  concurrency: 1
  cordon: true
  # Select on control-plane only: k3s 1.34 stops setting the `master` label.
  nodeSelector:
    matchExpressions:
      - { key: node-role.kubernetes.io/control-plane, operator: Exists }
  tolerations:
    - { key: node-role.kubernetes.io/control-plane, operator: Exists }
    # The masters still carry a custom `master` NoSchedule taint (--node-taint).
    - { key: node-role.kubernetes.io/master, operator: Exists }
    - { key: node-role.kubernetes.io/etcd, operator: Exists }
  upgrade:
    image: rancher/k3s-upgrade
