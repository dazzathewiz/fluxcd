---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Keep the CRD, the manifests ref and the image on the same release. The
  # controller also writes its embedded CRD at startup, so a mismatched file
  # here makes Flux and the controller overwrite each other's CRD.
  - https://github.com/rancher/system-upgrade-controller/releases/download/v0.20.2/crd.yaml
  - https://github.com/rancher/system-upgrade-controller?ref=v0.20.2
images:
  - name: rancher/system-upgrade-controller
    newTag: v0.20.2
patchesStrategicMerge:
  - |
    $patch: delete
    apiVersion: v1
    kind: Namespace
    metadata:
      name: system-upgrade
labels:
  - pairs:
      app.kubernetes.io/name: "${APP}"
      app.kubernetes.io/instance: "${APP}"
    includeSelectors: true
