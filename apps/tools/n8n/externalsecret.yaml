---
# 1Password item `n8n`. `db-password` feeds both n8n and Postgres.
# CREDENTIALS_OVERWRITE_DATA fills the empty fields of the stored githubApi,
# postgres and jwtAuth credentials at run time, so their records hold no secret.
# TRIAGE_DB_PASSWORD is templated from db-password; see below.
# TRIAGE_RENDER_DB_PASSWORD sets the triage_render role's password (roles.sql).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-secrets
  namespace: tools
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-k3s
  target:
    creationPolicy: Owner
    template:
      engineVersion: v2
      # Replace: the Secret holds exactly the keys templated here. Every `data`
      # entry below is only a template input. The App key reaches the Secret
      # only decoded, inside CREDENTIALS_OVERWRITE_DATA (jwtAuth).
      mergePolicy: Replace
      data:
        N8N_ENCRYPTION_KEY: '{{ .N8N_ENCRYPTION_KEY }}'
        DB_POSTGRESDB_PASSWORD: '{{ .DB_POSTGRESDB_PASSWORD }}'
        POSTGRES_PASSWORD: '{{ .POSTGRES_PASSWORD }}'
        GITHUB_TOKEN: '{{ .GITHUB_TOKEN }}'
        REDACTION_PATTERNS: '{{ .REDACTION_PATTERNS }}'
        GITHUB_APP_ID: '{{ .GITHUB_APP_ID }}'
        GITHUB_APP_INSTALLATION_ID: '{{ .GITHUB_APP_INSTALLATION_ID }}'
        HA_HEARTBEAT_URL: '{{ .HA_HEARTBEAT_URL }}'
        TRIAGE_RENDER_DB_PASSWORD: '{{ .TRIAGE_RENDER_DB_PASSWORD }}'
        # The workflows' postgres credential logs in as the least-privilege
        # `triage` role (triage/roles.sql), not the n8n superuser. Its password
        # is a one-way hash of db-password, so it needs no extra 1Password field
        # and can't be turned back into the superuser password. Keep the two
        # expressions below identical.
        TRIAGE_DB_PASSWORD: '{{ printf "n8n-triage-db:%s" .DB_POSTGRESDB_PASSWORD | sha256sum }}'
        CREDENTIALS_OVERWRITE_DATA: >-
          {"githubApi":{"accessToken":{{ .GITHUB_TOKEN | toJson }}},
          "postgres":{"host":"n8n-db","port":5432,"database":"n8n","user":"triage",
          "password":{{ printf "n8n-triage-db:%s" .DB_POSTGRESDB_PASSWORD | sha256sum | toJson }}},
          "jwtAuth":{"privateKey":{{ .GITHUB_APP_PRIVATE_KEY_B64 | b64dec | toJson }}}}
  data:
  - secretKey: N8N_ENCRYPTION_KEY
    remoteRef:
      key: n8n
      property: encryption-key
  - secretKey: DB_POSTGRESDB_PASSWORD
    remoteRef:
      key: n8n
      property: db-password
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: n8n
      property: db-password
  - secretKey: GITHUB_TOKEN
    remoteRef:
      key: n8n
      property: github-token
  - secretKey: REDACTION_PATTERNS
    remoteRef:
      key: n8n
      property: redaction-patterns
  # The GitHub App (write_mode labels). The key is stored base64 on one line,
  # because 1Password flattens line breaks; the template above decodes it.
  - secretKey: GITHUB_APP_ID
    remoteRef:
      key: n8n
      property: github-app-id
  - secretKey: GITHUB_APP_INSTALLATION_ID
    remoteRef:
      key: n8n
      property: github-app-installation-id
  - secretKey: GITHUB_APP_PRIVATE_KEY_B64
    remoteRef:
      key: n8n
      property: github-app-private-key-b64
  # The Home Assistant heartbeat webhook, full URL. Seeded into Postgres.
  - secretKey: HA_HEARTBEAT_URL
    remoteRef:
      key: n8n
      property: ha-heartbeat-url
  # The triage-render CronJob's login; the initContainer sets it on the role.
  - secretKey: TRIAGE_RENDER_DB_PASSWORD
    remoteRef:
      key: n8n
      property: triage-render-db-password
---
# The triage-render CronJob's database password, and nothing else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: triage-render-secrets
  namespace: tools
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-k3s
  target:
    creationPolicy: Owner
  data:
  - secretKey: TRIAGE_RENDER_DB_PASSWORD
    remoteRef:
      key: n8n
      property: triage-render-db-password
