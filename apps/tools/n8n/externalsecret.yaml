---
# 1Password item `n8n`. `db-password` feeds both n8n and Postgres.
# `github-token` and `redaction-patterns` are not consumed yet.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-secrets
  namespace: tools
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-k3s
  target:
    creationPolicy: Owner
  data:
  - secretKey: N8N_ENCRYPTION_KEY
    remoteRef:
      key: n8n
      property: encryption-key
  - secretKey: DB_POSTGRESDB_PASSWORD
    remoteRef:
      key: n8n
      property: db-password
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: n8n
      property: db-password
  - secretKey: GITHUB_TOKEN
    remoteRef:
      key: n8n
      property: github-token
  - secretKey: REDACTION_PATTERNS
    remoteRef:
      key: n8n
      property: redaction-patterns
