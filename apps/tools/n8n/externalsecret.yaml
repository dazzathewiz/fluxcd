---
# 1Password item `n8n`. `db-password` feeds both n8n and Postgres.
# CREDENTIALS_OVERWRITE_DATA fills the empty fields of the stored githubApi
# and postgres credentials at run time, so their records hold no secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-secrets
  namespace: tools
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-k3s
  target:
    creationPolicy: Owner
    template:
      engineVersion: v2
      # Merge keeps every `data` key below alongside the templated one.
      mergePolicy: Merge
      data:
        CREDENTIALS_OVERWRITE_DATA: >-
          {"githubApi":{"accessToken":{{ .GITHUB_TOKEN | toJson }}},
          "postgres":{"host":"n8n-db","port":5432,"database":"n8n","user":"n8n",
          "password":{{ .DB_POSTGRESDB_PASSWORD | toJson }}}}
  data:
  - secretKey: N8N_ENCRYPTION_KEY
    remoteRef:
      key: n8n
      property: encryption-key
  - secretKey: DB_POSTGRESDB_PASSWORD
    remoteRef:
      key: n8n
      property: db-password
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: n8n
      property: db-password
  - secretKey: GITHUB_TOKEN
    remoteRef:
      key: n8n
      property: github-token
  - secretKey: REDACTION_PATTERNS
    remoteRef:
      key: n8n
      property: redaction-patterns
