---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: tools
  name: n8n
  labels:
    app: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO PVC
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      serviceAccountName: n8n
      # The `n8n` Service would otherwise inject N8N_PORT=tcp://...
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      initContainers:
      # Applies triage/schema.sql, reloads config.yaml, reseeds the redaction
      # patterns and the heartbeat URL, and resets the least-privilege `triage`
      # and `triage_render` roles. Idempotent.
      - name: triage-schema
        image: postgres:17.12-alpine
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          until pg_isready -q; do echo "waiting for n8n-db"; sleep 2; done
          psql -X -v ON_ERROR_STOP=1 -f /triage/schema.sql -f /triage/seed.sql -f /triage/roles.sql
        env:
        - name: PGHOST
          value: "n8n-db"
        - name: PGUSER
          value: "n8n"
        - name: PGDATABASE
          value: "n8n"
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: DB_POSTGRESDB_PASSWORD
        - name: REDACTION_PATTERNS
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: REDACTION_PATTERNS
        - name: TRIAGE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: TRIAGE_DB_PASSWORD
        - name: TRIAGE_RENDER_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: TRIAGE_RENDER_DB_PASSWORD
        # Identifiers, loaded into triage.config by seed.sql.
        - name: GITHUB_APP_ID
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: GITHUB_APP_ID
              optional: true
        - name: GITHUB_APP_INSTALLATION_ID
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: GITHUB_APP_INSTALLATION_ID
              optional: true
        # Seeded into triage.alert_target; read only by TriageAlertV01.
        - name: HA_HEARTBEAT_URL
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: HA_HEARTBEAT_URL
              optional: true
        volumeMounts:
        - name: triage
          mountPath: /triage
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      # Git wins: import overwrites the workflows (and unpublishes them), then
      # each one is published again. UI edits are lost on every restart.
      - name: import-workflows
        image: n8nio/n8n:2.49.3
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          # Binary copies of the SA token written to the PVC before binary data
          # moved to tmpfs. Prune can no longer reach them, so remove them here.
          rm -rf /home/node/.n8n/storage/workflows/TriageClusterV01 /home/node/.n8n/binaryData/workflows/TriageClusterV01
          # The GitHub App key must be an RSA PEM. Checked without printing it.
          node -e '
            let ok = false;
            try {
              const k = (JSON.parse(process.env.CREDENTIALS_OVERWRITE_DATA || "{}").jwtAuth || {}).privateKey || "";
              ok = k.startsWith("-----BEGIN") && require("crypto").createPrivateKey(k).asymmetricKeyType === "rsa";
            } catch (e) {}
            if (!ok) { console.error("GitHub App private key: not an RSA PEM (check github-app-private-key-b64)"); process.exit(1); }
            console.log("GitHub App private key: RSA PEM ok");
          '
          n8n import:credentials --separate --input=/import/credentials
          n8n import:workflow --separate --input=/import/workflows
          n8n publish:workflow --id=TriageClusterV01
          n8n publish:workflow --id=TriagePublishV01
          n8n publish:workflow --id=TriageAlertV01
          n8n publish:workflow --id=TriagePoll000001
          n8n publish:workflow --id=TriageBeat000001
          n8n publish:workflow --id=TriageWatch00001
        envFrom:
        - configMapRef:
            name: n8n-env
        - secretRef:
            name: n8n-secrets
        volumeMounts:
        - name: data
          mountPath: /home/node/.n8n
        - name: workflows
          mountPath: /import/workflows
          readOnly: true
        - name: credentials
          mountPath: /import/credentials
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
      containers:
      - name: n8n
        image: n8nio/n8n:2.49.3
        envFrom:
        - configMapRef:
            name: n8n-env
        - secretRef:
            name: n8n-secrets
        env:
        - name: N8N_EDITOR_BASE_URL
          value: "https://n8n.inf.${PERSONAL_DOMAIN}/"
        # Lets n8n verify kubernetes.default.svc for the GET /version that R4 uses.
        - name: NODE_EXTRA_CA_CERTS
          value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        # Binary data in RAM only, never on the backed-up PVC: the cluster-version
        # sub-workflow's token read lands here until prune removes it.
        - name: N8N_BINARY_DATA_STORAGE_PATH
          value: "/n8n-binary-data"
        ports:
        - containerPort: 5678
          name: http
        volumeMounts:
        - name: data
          mountPath: /home/node/.n8n
        - name: binary-data
          mountPath: /n8n-binary-data
        # /healthz answers without the database; /healthz/readiness waits for
        # the DB connection and migrations.
        startupProbe:
          httpGet:
            path: /healthz/readiness
            port: http
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /healthz/readiness
            port: http
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 30
          failureThreshold: 6
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: n8n-data
      # tmpfs; counts against the n8n container's 1Gi memory limit.
      - name: binary-data
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
      - name: workflows
        configMap:
          name: n8n-workflows
      - name: credentials
        configMap:
          name: n8n-credentials
      - name: triage
        configMap:
          name: n8n-triage
