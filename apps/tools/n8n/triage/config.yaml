# PR triage rules config. Non-secret; reviewed like any manifest.
# Parsed by rules.js (block-style YAML subset: maps, lists, [a, b], quoted
# scalars, >- folded text).

# off: no GitHub writes; each run records the plan in triage.publications.
# labels: the GitHub App applies it (label, comment, commit status).
# Quoted: YAML 1.1 parsers read a bare off as false.
write_mode: "labels"

# One line, flow style: the poll workflow's SQL reads this line to list repos,
# and the rules code checks it against the parsed config.
repos: [dazzathewiz/fluxcd]

# PRs triaged per run, oldest first.
per_run_cap: 10

renovate_logins:
  - "renovate[bot]"

# Evidence URL for R4. The call itself is made by the triage-cluster-version
# sub-workflow with the pod's service-account token (anonymous auth is off).
cluster_version_url: "https://kubernetes.default.svc/version"

# Negative control: no cluster satisfies this, so R4 must fail it every run.
negative_control_kube_version: ">=99"

# R3: mirrors renovate.json packageRules with dependencyDashboardApproval.
# A rule with no package matches any package; no update_types matches any.
gated:
  - package: postgres
    datasource: docker
    update_types: [major]
  - package: k3s-io/k3s
    datasource: github-releases
  - datasource: helm
    update_types: [major]
  - package: longhorn
    datasource: helm
    update_types: [minor, major]
  - package: fluxcd/flux2
    update_types: [minor, major]
  - package: rancher/system-upgrade-controller
  - package: n8nio/n8n
    datasource: docker
    update_types: [major]

# R5: mirrors renovate.json allowedVersions caps, one-minor rules and groups.
caps:
  - package: traefik
    below: "24.0.0"
  - package: fluxcd/flux2
    below: "2.10.0"
  - package: portainer/agent
    below: "3.0.0"

one_minor_per_pr:
  - longhorn
  - rancher

groups:
  - name: portainer
    branch: renovate/portainer
    packages: [portainer, portainer/agent]

# Removed from the cluster; any package or path containing these fails R5.
removed:
  - rook-ceph
  - rook/ceph

# Verdict: these packages always go to deep-review.
deep_review_packages:
  - longhorn
  - fluxcd/flux2
  - k3s-io/k3s
  - traefik
  - postgres

# Verdict: these packages never come out better than review.
review_floor_packages: [n8nio/n8n]

# R2: lets these updates pass outside apps/. Lifts only the path reason:
# the change must still be one version line.
path_class_overrides:
  - package: tailscale-operator
    datasource: helm
    path_class: infrastructure
    update_types: [patch, minor]

# Things outside the repo that depend on a package. Each entry goes into the
# verdict's reasons; floor (optional) caps how good the verdict can be.
dependants:
  inventree/inventree:
    - id: intake-script
      where: off-repo operator workspace
      floor: review
      check: >-
        REST API changes in the release notes (API version bumps, removed
        or renamed fields) on: part, part/category, stock, stock/location,
        stock/transfer, parameter, parameter/template, note, attachment,
        generic/status/custom, contenttype, icons
  caddy:
    - id: media-serving
      where: inventory app
      check: after rollout, open a part image and a stock attachment

# R6: case-insensitive substrings in Renovate's release notes.
release_note_keywords:
  - breaking
  - BREAKING CHANGE
  - CRD
  - kubeVersion
  - deprecat
  - removed
  - migrat
  - requires
  - values

# R1 classifications that can be low-risk.
low_risk_update_types: [digest, patch, minor]

# R4: chart -> Helm repository URL (index.yaml is fetched from it).
# rules.test.js checks this matches the HelmRepositories in the repo.
helm_index:
  influxdb: "https://helm.influxdata.com/"
  influxdb2: "https://helm.influxdata.com/"
  portainer: "https://portainer.github.io/k8s/"
  rancher: "https://releases.rancher.com/server-charts/stable"
  intel-device-plugins-gpu: "https://intel.github.io/helm-charts/"
  intel-device-plugins-operator: "https://intel.github.io/helm-charts/"
  reloader: "https://stakater.github.io/stakater-charts"
  tailscale-operator: "https://pkgs.tailscale.com/helmcharts"
  connect: "https://1password.github.io/connect-helm-charts/"
  external-secrets: "https://charts.external-secrets.io"
  longhorn: "https://charts.longhorn.io"
  cert-manager: "https://charts.jetstack.io"
  traefik: "https://helm.traefik.io/traefik"
  node-feature-discovery: "https://kubernetes-sigs.github.io/node-feature-discovery/charts"
  reflector: "https://emberstack.github.io/helm-charts"

# write_mode labels: the only labels the App adds or removes (rules.js pins
# these names), and the commit status context it sets.
verdict_labels:
  low-risk: "triage:low-risk"
  review: "triage:review"
  deep-review: "triage:deep-review"
  human: "triage:human"
  blocked: "triage:blocked"
outcome_labels: [merge, merge-watched]
status_context: "pr-triage/verdict"

# The GitHub App that writes them. Its own label events and comments are
# the ones by <app_slug>[bot].
app_slug: dtw-pr-triage

# R10 post-merge watch. off: plans only; labels: the App writes them (needs
# write_mode labels too). Quoted for the same reason as write_mode.
watch_write_mode: "labels"
# Minutes after the merge before a watch times out.
watch_timeout_min: 30
# The heartbeat reports stale after this many minutes without a watch run.
watch_stale_min: 30

# Path prefix -> the Flux Kustomization that applies it; the longest prefix
# wins. target_namespace mirrors the Kustomization's targetNamespace.
# rules.test.js checks this against every Flux Kustomization in the repo.
watch_kustomizations:
  - path: apps/
    name: apps
  - path: apps/databases/influxdb/app/
    name: influxdb
    target_namespace: databases
  - path: apps/infrastructure/portainer/app/
    name: portainer
    target_namespace: infrastructure
  - path: apps/monitoring/grafana/app/
    name: grafana
    target_namespace: monitoring
  - path: apps/tools/system-upgrade-controller/app/
    name: system-upgrade-controller
    target_namespace: tools
  - path: apps/tools/system-upgrade-controller/plans/
    name: system-upgrade-controller-plans
    target_namespace: tools
  - path: cluster-config/
    name: cluster-config
  - path: global/
    name: cluster-config
  - path: clusters/home/
    name: flux-system
  - path: infrastructure/configs/
    name: infra-configs
  - path: infrastructure/controllers/
    name: infra-controllers
  - path: infrastructure/tailscale/
    name: tailscale-operator
  - path: infrastructure/tailscale-connectors/app-zone-route/
    name: tailscale-connector
  - path: infrastructure/tailscale-connectors/inf-zone-route/
    name: tailscale-inf-connector
  - path: orchestration/
    name: cluster-orchestration

# A failure on a change to these packages is fixed forward, never reverted.
fix_forward_packages: [inventree/inventree]
