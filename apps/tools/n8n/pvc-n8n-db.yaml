---
# Postgres data directory. Backed up by the default Longhorn recurring-job group.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-db
  namespace: tools
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-diskencrypt-global
  resources:
    requests:
      storage: 5Gi
