---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret.yaml
  - pvc.yaml
  - cronjob.yaml
  - restore-test.yaml
  - volume-restore-test.yaml
  - networkpolicy.yaml
# Shell `${...}` would be blanked by Flux postBuild substitution.
configMapGenerator:
  - name: db-backup-scripts
    namespace: tools
    files:
      - scripts/lib.sh
      - scripts/backup.sh
      - scripts/restore-test.sh
      - scripts/volume-restore-test.sh
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
