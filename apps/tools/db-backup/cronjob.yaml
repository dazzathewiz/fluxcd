---
# 30 minutes before Longhorn's daily-backups (11:00 UTC), so each offsite
# backup carries that night's dumps. The image tracks the two DB Deployments:
# pg_dump must not be older than the server.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: tools
  labels:
    app: db-backup
spec:
  schedule: "30 20 * * *"
  timeZone: Australia/Brisbane
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: db-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            fsGroup: 70
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: backup
            image: postgres:17.12-alpine
            command: ["/bin/sh", "/scripts/backup.sh"]
            envFrom:
            - secretRef:
                name: db-backup-secrets
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: backup
              mountPath: /backup
            - name: tmp
              mountPath: /tmp
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 512Mi
          volumes:
          - name: scripts
            configMap:
              name: db-backup-scripts
          - name: backup
            persistentVolumeClaim:
              claimName: db-backup
          - name: tmp
            emptyDir:
              sizeLimit: 64Mi
