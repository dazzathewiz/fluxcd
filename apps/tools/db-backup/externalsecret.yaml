---
# Existing fields only: the two databases' owner passwords and the Home
# Assistant webhook URL from the n8n item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-backup-secrets
  namespace: tools
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-k3s
  target:
    creationPolicy: Owner
  data:
  - secretKey: N8N_DB_PASSWORD
    remoteRef:
      key: n8n
      property: db-password
  - secretKey: INVENTORY_DB_PASSWORD
    remoteRef:
      key: inventory
      property: db-password
  - secretKey: HA_HEARTBEAT_URL
    remoteRef:
      key: n8n
      property: ha-heartbeat-url
