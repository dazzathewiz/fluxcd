---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: changedetection-basicauth
  namespace: tools
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-k3s
  target:
    creationPolicy: Owner
  data:
  - secretKey: users
    remoteRef:
      key: changedetection
      property: users
