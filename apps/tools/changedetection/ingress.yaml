---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: default-headers
  namespace: tools
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true
    forceSTSHeader: true
    stsIncludeSubdomains: true
    stsSeconds: 15552000
    customFrameOptionsValue: SAMEORIGIN
    customRequestHeaders:
      X-Forwarded-Proto: "https"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: changedetection-basicauth
  namespace: tools
spec:
  basicAuth:
    secret: changedetection-basicauth
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: changedetection
  namespace: tools
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`changedetection.inf.${PERSONAL_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: default-headers
        - name: changedetection-basicauth
      services:
        - name: changedetection
          port: 5000
          passHostHeader: true
  tls:
    secretName: inf-personal-domain-tls
