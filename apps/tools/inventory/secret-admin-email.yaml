---
# The first-boot superuser's email, from global-secrets (EMAIL_1) via Flux
# postBuild substitution rather than a 1Password property.
#
# A Secret, not a key in inventory-env, on purpose: the resolved address lands in
# whatever object holds it, and the cluster's read-only `view` identities can
# read ConfigMaps but not Secrets. Git only ever holds the placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: inventory-admin-email
  namespace: tools
type: Opaque
stringData:
  INVENTREE_ADMIN_EMAIL: "${EMAIL_1}"
