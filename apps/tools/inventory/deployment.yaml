---
# Three containers in one pod, deliberately.
#
# The server, the background worker and the static/media file server all need
# read or write access to the SAME data volume. The cluster's storage class is
# ReadWriteOnce, so they cannot be separate Deployments without either an RWX
# class or node-affinity glue. One pod makes the shared mount trivially correct
# and has the useful side effect that the server and worker can never run
# mismatched versions across an upgrade.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: tools
  name: inventory
  labels:
    app: inventory
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO PVC -- RollingUpdate deadlocks mounting the same volume twice
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      # The image does LESS on boot than it looks like it does.
      #
      # Its ENTRYPOINT (contrib/container/init.sh) creates data/static,
      # data/media and data/backup and then `exec "$@"`. Its CMD is bare
      # gunicorn. Neither collects static files, and neither is the `invoke
      # update` path. INVENTREE_AUTO_UPDATE is not that path either: it is read
      # by src/backend/InvenTree/InvenTree/tasks.py, where it gates
      # `call_command('migrate')` in-process and nothing else.
      #
      # So on a stock deployment the schema migrates itself and nothing else
      # happens. Upstream's compose workflow covers the gap with a documented
      # manual `invoke update` after every image pull. That is not available to
      # a GitOps deployment, so the two steps that matter own a container each
      # here and run to completion before anything long-lived starts.
      initContainers:
      # Gate the app on the database actually accepting connections. Without
      # this, first boot races migrations against a Postgres that is still
      # running initdb, and the failure mode is a CrashLoopBackOff that looks
      # like a config error.
      - name: wait-for-db
        image: postgres:17.11-alpine
        command:
          - sh
          - -c
          - |
            until pg_isready -h inventory-db -p 5432 -U inventree; do
              echo "waiting for inventory-db"
              sleep 2
            done
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi

      # Migrations, before either long-running container exists.
      #
      # Doing this in-process via INVENTREE_AUTO_UPDATE (the previous
      # arrangement) runs the migration check in BOTH long-running containers,
      # because the server and the worker each boot the full Django app. They
      # start at the same instant and both try to apply the same migrations:
      #
      #   ProgrammingError: relation "plugin_notificationusersetting" already exists
      #
      # Three worker crash-restarts on first boot, self-resolving, and recurring
      # on every image bump that carries migrations. Moving migrate here gives it
      # exactly one owner, and a genuine migration failure now holds the pod in
      # Init instead of surfacing as a confusing 502.
      #
      # `invoke migrate` also runs `rebuild_models` (MPTT trees) and
      # `rebuild_thumbnails` (missing ones only) afterwards, on every pod start.
      # Cheap at this data size; worth knowing if boot ever gets slow.
      - name: db-migrate
        image: inventree/inventree:1.5.6
        # `args:`, not `command:` -- the image's ENTRYPOINT must still run, as
        # it is what prepares the venv and the data directory.
        args: ["invoke", "migrate"]
        envFrom:
        - configMapRef:
            name: inventory-env
        - secretRef:
            name: inventory-secrets
        - secretRef:
            name: inventory-admin-email
        volumeMounts:
        - name: data
          mountPath: /home/inventree/data
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 1536Mi

      # Collect static files into STATIC_ROOT (/home/inventree/data/static).
      #
      # THIS IS WHAT SERVES THE WEB UI. The compiled frontend ships inside the
      # image but lives under the source tree. /web is rendered by Django from
      # that tree's manifest, so it returns a 200 with the right <script> tags
      # regardless -- but the scripts point at /static/web/assets/, which Caddy
      # serves from STATIC_ROOT. Until the files are collected there, every
      # script 404s, the SPA never mounts, and the page shows only its built-in
      # "issue with your update ... INVE-E1" fallback text. (Not the separate
      # "No frontend included" heading: that one means the image itself lacks
      # the bundle.)
      #
      # Nothing flags this: the probes hit /api/, which has no static
      # dependency, and the Caddyfile has no `log` directive, so the asset 404s
      # are not logged anywhere.
      #
      # `invoke static`, not `invoke update`: update also runs `install` (pip
      # at container boot) and `backup`, neither of which belongs in a startup
      # path. It runs `collectstatic --no-input --clear`, which empties the
      # contents of STATIC_ROOT but not the directory itself, so Caddy's
      # `subPath: static` bind mount stays valid across restarts.
      #
      # Ordered after db-migrate because `manage.py` boots the full Django app,
      # which touches the database.
      - name: collect-static
        image: inventree/inventree:1.5.6
        args: ["invoke", "static"]
        envFrom:
        - configMapRef:
            name: inventory-env
        - secretRef:
            name: inventory-secrets
        - secretRef:
            name: inventory-admin-email
        volumeMounts:
        - name: data
          mountPath: /home/inventree/data
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 1536Mi

      containers:
      - name: server
        image: inventree/inventree:1.5.6
        envFrom:
        - configMapRef:
            name: inventory-env
        - secretRef:
            name: inventory-secrets
        - secretRef:
            name: inventory-admin-email
        ports:
        - containerPort: 8000
          name: http
        volumeMounts:
        - name: data
          mountPath: /home/inventree/data
        # Migrations and static collection have already run in initContainers,
        # so this is now only gunicorn's own boot. The budget stays generous
        # anyway: Django app-ready work still runs here, and a tight budget on
        # the one route into this app buys nothing.
        startupProbe:
          httpGet:
            path: /api/
            port: 8000
          failureThreshold: 60
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/
            port: 8000
          periodSeconds: 30
          failureThreshold: 6
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 1536Mi

      - name: worker
        image: inventree/inventree:1.5.6
        # Compose's `command:` maps to k8s `args:`, not `command:` -- the image's
        # ENTRYPOINT must still run. Using `command:` here would bypass it and
        # the worker would never start.
        args: ["invoke", "worker"]
        envFrom:
        - configMapRef:
            name: inventory-env
        - secretRef:
            name: inventory-secrets
        - secretRef:
            name: inventory-admin-email
        volumeMounts:
        - name: data
          mountPath: /home/inventree/data
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            memory: 1Gi

      - name: caddy
        image: caddy:2.11.6-alpine
        ports:
        - containerPort: 8080
          name: web
        volumeMounts:
        - name: caddyfile
          mountPath: /etc/caddy/Caddyfile
          subPath: Caddyfile
          readOnly: true
        - name: data
          mountPath: /var/www/static
          subPath: static
          readOnly: true
        - name: data
          mountPath: /var/www/media
          subPath: media
          readOnly: true
        # Readiness is measured through Caddy to the server, so the pod is only
        # marked ready when the whole stack answers. Otherwise Traefik starts
        # sending traffic to a Caddy that is up in front of a server that isn't,
        # and the first thing seen is a 502.
        readinessProbe:
          httpGet:
            path: /api/
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 60
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: inventory-data
      - name: caddyfile
        configMap:
          name: inventory-caddy
