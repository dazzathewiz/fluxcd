---
# 1Password item `inventory` must exist with these four properties before this
# syncs. The database password is emitted twice under two key names because
# Postgres and InvenTree each expect their own variable name for the same value
# -- keeping it one source property means they cannot drift apart.
#
# The admin credentials are consumed only on first boot, to create the superuser.
# That account is the break-glass path: it is the way back in if the passkey
# flow ever fails, so it should be a long random string kept in 1Password and
# never used day to day.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inventory-secrets
  namespace: tools
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-k3s
  target:
    creationPolicy: Owner
  data:
  - secretKey: INVENTREE_DB_PASSWORD
    remoteRef:
      key: inventory
      property: db-password
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: inventory
      property: db-password
  - secretKey: INVENTREE_ADMIN_USER
    remoteRef:
      key: inventory
      property: admin-user
  - secretKey: INVENTREE_ADMIN_EMAIL
    remoteRef:
      key: inventory
      property: admin-email
  - secretKey: INVENTREE_ADMIN_PASSWORD
    remoteRef:
      key: inventory
      property: admin-password
